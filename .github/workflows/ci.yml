name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test geoboard generation
        run: |
          python -m geoboard --size 5 --boards 2 --challenges 4 --seed 42 --title 几何钉板 -o geoboard.html
          python -c "p=open('geoboard.html', encoding='utf-8').read(); assert p.count('<section') == 2; assert p.count('<svg') == 2; assert p.count('<circle') == 50; assert p.count('<article') == 4; assert '钉点数 5×5' in p; assert '钉板 1–2 · 共 2 块' in p; assert '第 2 页 / 共 2 页' in p; assert 'A4 portrait' in p; print('smoke ok')"
