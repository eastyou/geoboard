[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoboard"
version = "0.1.0"
description = "几何钉板：一键生成 A4 可打印钉板与面积/周长挑战卡"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["geoboard", "geometry", "area", "perimeter", "teacher", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
geoboard = "geoboard.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/geoboard"
Source = "https://github.com/eastyou/geoboard"

[tool.setuptools]
packages = ["geoboard"]
